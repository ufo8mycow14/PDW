name: Build PDW (Win32)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Win32 dependencies
        uses: actions/cache@v5
        with:
          path: out/dependencies/x86
          key: pdw-win32-dependencies-${{ hashFiles('scripts/build-dependencies.ps1') }}

      - name: Build pinned Win32 dependencies
        shell: pwsh
        run: .\scripts\build-dependencies.ps1

      - name: Configure CMake (Win32 / Release)
        shell: pwsh
        run: |
          $generator = .\scripts\resolve-cmake-generator.ps1
          cmake -S . -B build `
            -G "$generator" `
            -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DPDW_DEPENDENCY_ROOT="${{ github.workspace }}\out\dependencies\x86"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PDW-v4.5.0-Beta-Win32
          path: |
            build\Release\PDW v4.5.0 Beta.exe
            License
            THIRD_PARTY_NOTICES.md
            out\dependencies\x86\pdw-dependencies.lock
            out\dependencies\x86\licenses\*
          if-no-files-found: error
